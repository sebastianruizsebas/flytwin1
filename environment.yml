name: flytwin
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools
  - wheel
  - git
  # Scientific computing
  - numpy
  - scipy
  - matplotlib
  - pandas
  - seaborn
  - statsmodels
  - scikit-learn
  - h5py
  - tqdm
  - brian2
  - numba
  # Jupyter
  - jupyter
  - ipykernel
  - pip:
      # ── GPU wheels (install AFTER conda env create + activate) ──────────
      # PyTorch CUDA 13.2 — use cu132 for CUDA 13.2:
      #   pip install --index-url https://download.pytorch.org/whl/cu132 torch torchvision torchaudio
      # JAX CUDA 13 + cuDNN:
      #   pip install --upgrade "jax[cuda13_cudnn]" -f https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
      # brian2cuda (GPU Brian2, Linux only, requires CUDA 13 + cmake):
      #   pip install brian2cuda  # Linux only — do NOT install on Windows/macOS
      # CPU fallbacks (no NVIDIA GPU):
      #   pip install torch torchvision torchaudio   # default PyPI index = CPU
      #   pip install "jax[cpu]"
      # ────────────────────────────────────────────────────────────────────
      # Active Inference discrete POMDP controller (Level 3)
      # Use 0.0.7.1 — the 1.x API is incompatible (Agent expects obj_array not list)
      - inferactively-pymdp==0.0.7.1
      # Neural simulation and connectome access
      - neuprint-python
      # Simulation-Based Inference (NPE)
      - sbi
      # Body simulation
      - mujoco
      - dm_control
      # Janelia fly body model
      - git+https://github.com/TuragaLab/flybody.git
